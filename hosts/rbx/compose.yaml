name: fl

include:
  - ../../services/common/backbone/compose.yaml
  - ../../services/common/telemetry/compose.yaml
  - ../../services/ddownloader/compose.yaml
  # - ../../services/galleries/compose.yaml

services:

  ###############################################
  # Backbone services

  neo4j:
    cpus: 2.0
    healthcheck:
      interval: 60s
      timeout: 30s
      start_period: 300s

  postgres:
    ports:
      - ${POSTGRES_PORT}:5432

  rabbitmq:
    healthcheck:
      start_period: 60s

  redis:
    labels:
      fl.group: disabled

  ###############################################
  # Telemetry services

  jaeger:
    cpus: 1.0

  otelcol:
    cpus: 2.0

  ###############################################
  # Ddownloader services

  ddownloader:
    env_file:
      - config/ddownloader/ddownloader.env
    ports:
      - ${DDOWNLOADER_PORT}:5001
    volumes:
      - ./config/ddownloader/gdl-base.json:/opt/ddownloader/config/gdl-base.json

  ###############################################
  # Galleries services

  # start multiple replicas via `dc up -d --scale thumbnailer=3`
  # thumbnailer:
  #   environment:
  #     - 'OTEL_ENABLED=true'

networks:
  default:
    name: fleet
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.2.0/24
