services:
  otelcol:
    image: otel/opentelemetry-collector-contrib
    # ports:
    #   - 1888:1888   # pprof extension
    #   - 8888:8888   # Prometheus metrics exposed by the Collector
    #   - 8889:8889   # Prometheus exporter metrics
    #   - 13133:13133 # health_check extension
    #   - 4317:4317   # OTLP gRPC receiver
    #   - 4318:4318   # OTLP http receiver
    #   - 55679:55679 # zpages extension
    volumes:
      - "./config/otelcol.yaml:/etc/otelcol-contrib/config.yaml"
      - "/:/hostfs:ro"

    # environment:
    #   # Override per host to add host.name and service.namespace to host metrics.
    #   - 'OTEL_RESOURCE_ATTRIBUTES=host.name=<host-name>,service.namespace=<namespace>'

    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 5m
      timeout: 10s
      retries: 0
      start_period: 5s
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  # From: https://www.jaegertracing.io/docs/2.5/getting-started/#all-in-one
  jaeger:
    image: jaegertracing/jaeger:2.5.0
    ports:
      - ${JAEGER_UI_PORT}:16686 # UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - ${PROMETHEUS_UI_PORT}:9090 # UI and APIs
    volumes:
      - "./config/prometheus.yaml:/etc/prometheus/prometheus.yml"
      - "prometheus_data:/prometheus"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - ${GRAFANA_UI_PORT}:3000 # UI
    volumes:
      - "grafana_data:/var/lib/grafana"
      - "./config/grafana/datasources:/etc/grafana/provisioning/datasources"
      # - "./config/grafana/dashboards:/etc/grafana/provisioning/dashboards"
    environment:
      - "GF_SECURITY_ADMIN_USER=$GRAFANA_USER"
      - "GF_SECURITY_ADMIN_PASSWORD=$GRAFANA_PASS"
      # - GF_INSTALL_PLUGINS= # You can install plugins here if needed
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dozzle_data:/data
    ports:
      - ${DOZZLE_PORT}:8080
    environment:
      # Uncomment to enable container actions (stop, start, restart). See https://dozzle.dev/guide/actions
      - DOZZLE_ENABLE_ACTIONS=true

      # Uncomment to allow access to container shells. See https://dozzle.dev/guide/shell
      - DOZZLE_ENABLE_SHELL=true

      # Uncomment to enable authentication. See https://dozzle.dev/guide/authentication
      # - DOZZLE_AUTH_PROVIDER=simple

      # Label this Dozzle instance (shown in the header and multi-host menu). See https://dozzle.dev/guide/hostname
      - DOZZLE_HOSTNAME=${DOZZLE_HOSTNAME:-fleet}

      # Connect to one or more remote agents to monitor other Docker hosts. See https://dozzle.dev/guide/agent
      # - DOZZLE_REMOTE_AGENT=192.168.1.10:7007,192.168.1.11:7007
      #
      # Only show containers matching a filter. See https://dozzle.dev/guide/filters
      # - DOZZLE_FILTER=label=com.example.app


volumes:
  prometheus_data:
  grafana_data:
  dozzle_data:
