receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000

exporters:
  debug:
    verbosity: normal

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    # Convert resource attributes into Prometheus labels.
    resource_to_telemetry_conversion:
      enabled: true
    # const_labels:
    #   service: hservices

service:
  # The part before the slash '/' is the required pipeline signal type
  # (e.g. 'metrics', 'traces'), and the suffix is an arbitrary name.
  # The names have no effect on routing; the receivers, processors, and
  # exporters lists determine the behavior.
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics/otlp:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
