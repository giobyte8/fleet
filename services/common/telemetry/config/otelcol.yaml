receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Host metrics receiver configuration
  # docs: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/hostmetricsreceiver/README.md
  host_metrics:
    root_path: /hostfs              # Host filesystem mounted in the container
    collection_interval: 10s        # Default 1m
    scrapers:
      cpu:
      #load:
      memory:
      disk:
      filesystem:
      network:
      #paging:
      #processes:

processors:
  batch:
    timeout: 10s
    send_batch_size: 1000

exporters:
  debug:
    verbosity: normal

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  prometheus:
    endpoint: 0.0.0.0:8889
    # const_labels:
    #   service: hservices

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp, host_metrics]
      processors: [batch]
      #exporters: [debug, prometheus]
      exporters: [prometheus]
